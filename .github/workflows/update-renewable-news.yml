name: Actualizar actualidad del sector energético

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-renewable-news.yml"
      - "scripts/update_renewable_news.py"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Actualizar titulares de fuentes especializadas
        run: python scripts/update_renewable_news.py
      - name: Guardar noticias actualizadas
        run: |
          if git diff --quiet -- noticias.json; then
            echo "No hay cambios en las noticias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Actualiza actualidad del sector energético"
          git pull --rebase origin main
          git push
